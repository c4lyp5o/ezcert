version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Must match the installed Bun runtime; bump together with Bun
      - dependency-name: bun-types
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: bun
    directory: /client
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The TypeScript 7 native build isn't supported by SvelteKit 3 / svelte-check yet
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
