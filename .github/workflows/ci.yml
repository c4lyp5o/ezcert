name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

# A newer push to the same branch/PR cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Keep the Bun version in step with bun-types in package.json (~1.3.x)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # SvelteKit 3 / Vite 8 need Node 22.17+
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install server dependencies
        run: bun install --frozen-lockfile

      - name: Install client dependencies
        run: bun install --frozen-lockfile
        working-directory: client

      # Uses an in-memory Postgres (PGlite) and a throwaway encryption key; no secrets needed
      - name: Test
        run: bun run test

      - name: Type-check (server + client)
        run: bun run typecheck

      - name: Build client
        run: bun run build:all
