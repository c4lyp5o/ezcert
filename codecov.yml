# Two flags: "server" (src/) and "client" (client/src/lib and the page load functions).
# Svelte components have no tests yet, so they aren't in the client figure.
flags:
  server:
    paths:
      - src/
  client:
    paths:
      - client/src/
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: 80%
comment:
  layout: "condensed_header, diff, files"
  require_changes: true
